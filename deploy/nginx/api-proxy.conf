server {
    listen 80;
    server_name _;

    # Gzip for API and text responses.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/plain
        text/xml;

    # Brotli requires nginx with brotli module (ngx_brotli).
    brotli on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types
        application/json
        application/javascript
        application/xml
        text/css
        text/plain
        text/xml;

    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
